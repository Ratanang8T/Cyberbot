name: .NET Build and Validation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Project_Path: Cyberbot/Cyberbot.csproj # Path to the project file

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache NuGet Packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x # Adjust to your project's .NET version

      - name: Validate Paths
        run: |
          if (-not (Test-Path -Path "${{ env.Project_Path }}")) {
            Write-Error "❌ Project file not found!"
            exit 1
          }
        shell: pwsh

      - name: Restore Dependencies
        run: dotnet restore ${{ env.Project_Path }}

      - name: Run Code Formatting Check
        run: dotnet format --verify-no-changes ${{ env.Project_Path }} || exit 1

      - name: Build Project
        run: dotnet build ${{ env.Project_Path }} --configuration Release --no-restore

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: bin/Release/net9.0 # Adjust based on your target framework
