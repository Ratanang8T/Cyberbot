name: C# CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # Step 3: Set up NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # Step 4: Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore "Cyberbot.sln" # Match the solution file name to the project

      # Step 5: Check Code Formatting
      - name: Check Code Formatting
        run: dotnet format --verify-no-changes "Cyberbot.sln" || exit 1 # Match the solution file name

      # Step 6: Build the Project
      - name: Build Project
        run: msbuild "Cyberbot.sln" /p:Configuration=Release # Match the solution file name

      # Step 7: Run Unit Tests (Optional but recommended)
      - name: Run Unit Tests
        run: dotnet test "Cyberbot.sln" --configuration Release --no-build --verbosity normal
